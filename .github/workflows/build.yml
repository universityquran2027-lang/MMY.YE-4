name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter create . --platforms=android,windows --org ye.mmy --project-name mmy_ye
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=android --org ye.mmy --project-name mmy_ye
      - run: rm -f test/widget_test.dart
      - run: python3 tools/apply_native_overlay.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mmy-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=windows --org ye.mmy --project-name mmy_ye
      - run: Remove-Item -Force -ErrorAction SilentlyContinue test/widget_test.dart
        shell: pwsh
      - run: python tools/apply_native_overlay.py
        continue-on-error: true
      - run: Copy-Item native_overlay/windows/runner/resources/app_icon.ico windows/runner/resources/app_icon.ico -Force
        shell: pwsh
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mmy-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: mmy-windows
          path: mmy-windows.zip
